[project]
name = "ocr-synth"
version = "0.1.0"
description = "Generador de datos sintéticos (PDF degradado + Ground Truth) para OCR. Solo datos de prueba MOCK."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "faker>=25",
    "reportlab>=4.1",
    "pypdfium2>=4.30",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
generate = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "src", "tests"]
